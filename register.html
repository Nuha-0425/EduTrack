<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — EduTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-brand"><span class="brand-icon">🎓</span> EduTrack</a>
      <div class="navbar-links">
        <a href="index.html">Home</a>
        <a href="register.html" class="active">Register</a>
        <a href="login.html">Login</a>
      </div>
      <button class="navbar-toggle" id="navbarToggle"><span></span><span></span><span></span></button>
    </div>
    <div class="navbar-mobile" id="navbarMobile">
      <a href="index.html">Home</a><a href="register.html">Register</a><a href="login.html">Login</a>
    </div>
  </nav>

  <div class="auth-page" style="align-items: flex-start; padding-top: 2rem; padding-bottom: 2rem;">
    <div class="auth-card wide">

      <div class="auth-header">
        <div class="auth-icon">📝</div>
        <h2>Create Your Account</h2>
        <p>Fill in your details below to register as a student.</p>
      </div>

      <div id="formAlert" class="alert hidden" role="alert"></div>

      <form id="registerForm" novalidate>

        <p class="form-section-title">Personal Information</p>

        <div class="grid-2">
          <div class="form-group">
            <label class="form-label" for="firstName">First Name <span class="required">*</span></label>
            <input type="text" id="firstName" class="form-control" placeholder="e.g. John" autocomplete="given-name" />
            <div class="form-error" id="firstNameError"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="lastName">Last Name <span class="required">*</span></label>
            <input type="text" id="lastName" class="form-control" placeholder="e.g. Doe" autocomplete="family-name" />
            <div class="form-error" id="lastNameError"></div>
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label class="form-label" for="studentId">Student ID <span class="required">*</span></label>
            <input type="text" id="studentId" class="form-control" placeholder="e.g. STU-2024-001" autocomplete="off" />
            <div class="form-hint">Your school-assigned student ID number.</div>
            <div class="form-error" id="studentIdError"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="gender">Gender <span class="required">*</span></label>
            <select id="gender" class="form-control">
              <option value="">— Select gender —</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
            </select>
            <div class="form-error" id="genderError"></div>
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label class="form-label" for="dateOfBirth">Date of Birth <span class="required">*</span></label>
            <input type="date" id="dateOfBirth" class="form-control" />
            <div class="form-error" id="dateOfBirthError"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="grade">Grade / Year <span class="required">*</span></label>
            <select id="grade" class="form-control">
              <option value="">— Select grade —</option>
              <option value="9">9th Grade</option>
              <option value="10">10th Grade</option>
              <option value="11">11th Grade</option>
              <option value="12">12th Grade</option>
            </select>
            <div class="form-error" id="gradeError"></div>
          </div>
          <div class="form-group">
  <label class="form-label" for="section">
    Section <span class="required">*</span>
  </label>

  <select id="section" class="form-control">
    <option value="">— Select section —</option>
    <option value="A">Section A</option>
    <option value="B">Section B</option>
    <option value="C">Section C</option>
    <option value="D">Section D</option>
    <option value="E">Section E</option>
  </select>

  <div class="form-error" id="sectionError"></div>
</div>
        </div>

        <p class="form-section-title">Contact Information</p>

        <div class="grid-2">
          <div class="form-group">
            <label class="form-label" for="email">Email Address <span class="required">*</span></label>
            <input type="email" id="email" class="form-control" placeholder="john.doe@school.edu" autocomplete="email" />
            <div class="form-error" id="emailError"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="phone">Phone Number <span class="required">*</span></label>
            <input type="tel" id="phone" class="form-control" placeholder="e.g. +1 555-123-4567" autocomplete="tel" />
            <div class="form-error" id="phoneError"></div>
          </div>
        </div>

        <p class="form-section-title">Account Security</p>

        <div class="grid-2">
          <div class="form-group">
            <label class="form-label" for="password">Password <span class="required">*</span></label>
            <div class="input-wrapper">
              <input type="password" id="password" class="form-control" placeholder="At least 8 characters" autocomplete="new-password" />
              <button type="button" class="input-toggle-btn" id="togglePassword">👁️</button>
            </div>
            <div class="password-strength" id="passwordStrength">
              <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
              <div class="strength-text" id="strengthText"></div>
            </div>
            <div class="form-error" id="passwordError"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirm Password <span class="required">*</span></label>
            <div class="input-wrapper">
              <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter your password" autocomplete="new-password" />
              <button type="button" class="input-toggle-btn" id="toggleConfirm">👁️</button>
            </div>
            <div class="form-error" id="confirmPasswordError"></div>
          </div>
        </div>

        <div style="margin-top: var(--spacing-xl);">
          <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">Create Account</button>
        </div>

      </form>

      <p class="auth-footer-text">Already have an account? <a href="login.html">Sign in here</a></p>
    </div>
  </div>

  <script src="main.js"></script>
  <script src="register.js"></script>
</body>
</html>
